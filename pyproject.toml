[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jesse"
description = "A trading framework for cryptocurrencies"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "Saleh Mir", email = "saleh@jesse.trade" }]
dynamic = ["version"]
dependencies = [
    "arrow~=1.2.1",
    "blinker~=1.4",
    "click~=8.0.3",
    "numpy~=1.26.4",
    "pandas~=2.2.3",
    "peewee~=3.14.8",
    "psycopg2-binary~=2.9.9",
    "pydash~=6.0.0",
    "fnc~=0.5.3",
    "requests~=2.32.0",
    "scipy~=1.15.0",
    "statsmodels~=0.14.4",
    "tabulate~=0.8.9",
    "timeloop~=1.0.2",
    "websocket-client~=1.8.0",
    "wsaccel~=0.6.6",
    "simplejson~=3.16.0",
    "aioredis~=1.3.1",
    "redis~=4.1.4",
    "fastapi~=0.128.0",
    "uvicorn~=0.40.0",
    "websockets>=10.0.0",
    "python-dotenv~=1.2.1",
    "aiofiles~=0.7.0",
    "PyJWT~=2.11.0",
    "cryptography~=42.0.5",
    "ecdsa>=0.16.0",
    "optuna~=4.2.0",
    "ray",
    "eth-account~=0.13.5",
    "msgpack~=1.1.0",
    "starkbank-ecdsa~=1.1.0",
    "jesse-rust==1.2.0",
    "mcp==1.26.0",
    "joblib~=1.5.3",
    "scikit-learn~=1.7.2; python_version < '3.11'",
    "scikit-learn~=1.8.0; python_version >= '3.11'",
    "matplotlib~=3.10.3",
]

[dependency-groups]
dev = ["pytest~=6.2.5"]

[project.urls]
Homepage = "https://jesse.trade"
Documentation = "https://docs.jesse.trade"
Source = "https://github.com/jesse-ai/jesse"
Tracker = "https://github.com/jesse-ai/jesse/issues"

[project.scripts]
jesse = "jesse.__init__:cli"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["jesse*"]

[tool.setuptools.package-data]
"*" = ["*.dll", "*.dylib", "*.so", "*.json"]

[tool.setuptools.dynamic]
version = { attr = "jesse.version.__version__" }

[tool.uv]
# ponytail: ray/jesse-rust ship wheels only for these platforms; widen if needed
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
]
